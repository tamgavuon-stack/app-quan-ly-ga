name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2"

      - name: Build Windows installers
        shell: pwsh
        run: cargo tauri build --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: quan-ly-chan-nuoi-ga-windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/target/release/bundle/msi/*.msi
