[package]
name = "quan-ly-chan-nuoi-ga-windows"
version = "0.1.0"
description = "Ứng dụng Windows quản lý chăn nuôi gà"
authors = ["Quan Ly Chan Nuoi Ga"]
edition = "2021"

[lib]
name = "quan_ly_chan_nuoi_ga_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
